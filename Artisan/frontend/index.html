<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtisanConnect Geo Intelligence · Cameroun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="styles.css?v=23">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" defer></script>
  <script src="i18n.js?v=23" defer></script>
  <script src="cameroon.js?v=23" defer></script>
  <script src="core.js?v=23" defer></script>
  <script src="terrain3d.js?v=23" defer></script>
  <script src="page-home.js?v=23" defer></script>
  <script src="page-report.js?v=23" defer></script>
  <script src="page-compare.js?v=23" defer></script>
  <script src="page-forecast.js?v=23" defer></script>
  <script src="page-discover.js?v=23" defer></script>
  <script src="page-validation.js?v=23" defer></script>
  <script src="page-ai.js?v=23" defer></script>
  <script src="main.js?v=23" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <header class="topbar">
    <a class="brand" href="#/"><b>ARTISANCONNECT</b><span data-i18n="brand_sub"></span></a>
    <dl class="hud-meta" aria-hidden="true">
      <div><dt>SOURCE</dt><dd>NASA POWER · MERRA-2</dd></div>
      <div><dt>SPAN</dt><dd>1981 — 2025</dd></div>
    </dl>
    <nav class="nav" aria-label="Pages">
      <a href="#/" data-page-link="home" data-i18n="nav_home"></a>
      <a href="#/synthese" data-page-link="report" data-i18n="nav_report"></a>
      <a href="#/comparer" data-page-link="compare" data-i18n="nav_compare"></a>
      <a href="#/previsions" data-page-link="forecast" data-i18n="nav_forecast"></a>
      <a href="#/decouvertes" data-page-link="discover" data-i18n="nav_discover"></a>
      <a href="#/fiabilite" data-page-link="validation" data-i18n="nav_validation"></a>
      <a href="#/assistant" data-page-link="ai" data-i18n="nav_ai"></a>
    </nav>
    <button id="lang-toggle" class="lang" type="button">EN</button>
  </header>

  <main id="main" tabindex="-1">
    <!-- HOME: 3D risk terrain hero -->
    <section class="page" data-page="home">
      <div class="hero">
        <div class="hero-scene" id="scene">
          <div class="scene-labels" id="scene-labels"></div>
          <div id="map-tip" class="map-tip" hidden></div>
        </div>
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="data_badge"></p>
          <h1 id="home-title"><span data-i18n="home_t1"></span> <em data-i18n="home_t2"></em></h1>
          <p class="sub" data-i18n="home_sub"></p>
          <form class="town-search" id="town-search" role="search" autocomplete="off">
            <label class="field" for="town-input"><span data-i18n="search_label"></span></label>
            <div class="town-row">
              <input id="town-input" type="search" list="town-list" required>
              <button class="btn" type="submit" data-i18n="search_go"></button>
            </div>
            <datalist id="town-list"></datalist>
            <p class="town-error" id="town-error" role="alert" hidden></p>
          </form>
          <div class="field hero-hazard"><span data-i18n="hazard"></span><div class="seg" id="home-hazard"></div></div>
          <div class="hud" id="home-keys"></div>
          <div class="actions">
            <a class="btn" href="#/synthese" data-i18n="home_go_report"></a>
            <a class="btn btn-ghost" href="#/fiabilite" data-i18n="home_go_proof"></a>
          </div>
        </div>
        <div class="hero-frame" aria-hidden="true"></div>
        <aside class="risk-scale" id="legend" aria-label="Score"></aside>
        <div class="hero-strip">
          <p class="hero-status" id="hero-status"></p>
          <div class="timeline" id="timeline" aria-hidden="true"></div>
          <p class="hero-hint" data-i18n="home_drag"></p>
        </div>
        <p id="map-desc" class="sr-only"></p>
      </div>
      <div class="home-body">
        <div class="home-grid">
          <article class="card">
            <h2 data-i18n="home_top"></h2>
            <ol class="ranking" id="home-top"></ol>
            <details class="how" id="home-how"><summary data-i18n="how_title"></summary><div id="home-how-body"></div></details>
          </article>
          <nav class="stack" aria-label="Explorer">
            <a class="explore-link" href="#/synthese"><i data-i18n="ex_1_k"></i><b data-i18n="ex_1_t"></b><span data-i18n="ex_1_d"></span></a>
            <a class="explore-link" href="#/previsions"><i data-i18n="ex_2_k"></i><b data-i18n="ex_2_t"></b><span data-i18n="ex_2_d"></span></a>
            <a class="explore-link" href="#/decouvertes"><i data-i18n="ex_3_k"></i><b data-i18n="ex_3_t"></b><span data-i18n="ex_3_d"></span></a>
          </nav>
        </div>
      </div>
    </section>

    <!-- SYNTHESIS REPORT -->
    <section class="page" data-page="report" hidden>
      <header class="page-head">
        <h1 data-i18n="rep_title"></h1>
        <p class="sub" data-i18n="rep_sub"></p>
      </header>
      <div class="toolbar">
        <label><span data-i18n="place"></span><select id="rep-place"></select></label>
        <div class="field range"><span data-i18n="period"></span>
          <div class="range-row"><select id="rep-start" class="year"></select><span class="range-sep" aria-hidden="true">→</span><select id="rep-end" class="year"></select></div>
        </div>
        <div class="toolbar-end">
          <button id="rep-ai" class="btn" type="button" data-i18n="rep_ai"></button>
          <button id="rep-csv" class="btn btn-ghost" type="button" data-i18n="dl_csv"></button>
          <button id="rep-link" class="btn btn-ghost" type="button" data-i18n="copy_link"></button>
          <button id="rep-print" class="btn btn-ghost" type="button" data-i18n="rep_bulletin"></button>
        </div>
      </div>
      <div id="rep-body"></div>
      <article id="rep-ai-out" class="card ai-output" aria-live="polite" tabindex="0" hidden></article>
    </section>

    <!-- COMPARE -->
    <section class="page" data-page="compare" hidden>
      <header class="page-head">
        <h1 data-i18n="cmp_title"></h1>
        <p class="sub" data-i18n="cmp_sub"></p>
      </header>
      <div class="toolbar">
        <div class="places" id="cmp-places"></div>
        <div class="field range"><span data-i18n="period"></span>
          <div class="range-row"><select id="cmp-start" class="year"></select><span class="range-sep" aria-hidden="true">→</span><select id="cmp-end" class="year"></select></div>
        </div>
        <div class="toolbar-end">
          <button id="cmp-csv" class="btn btn-ghost" type="button" data-i18n="dl_csv"></button>
          <button id="cmp-link" class="btn btn-ghost" type="button" data-i18n="copy_link"></button>
        </div>
      </div>
      <div class="seg seg-wide" id="cmp-variable"></div>
      <article class="card">
        <div class="card-head"><h2 id="cmp-chart-title"></h2><button id="cmp-play" class="btn btn-ghost btn-small" type="button"></button></div>
        <div id="cmp-chart" class="chart chart-tall"></div>
        <p class="note-small" data-i18n="cmp_smooth"></p>
      </article>
      <div class="cmp-cards" id="cmp-cards"></div>
      <p class="note-small" data-i18n="cmp_note"></p>
    </section>

    <!-- FORECAST + ADVICE -->
    <section class="page" data-page="forecast" hidden>
      <header class="page-head">
        <h1 data-i18n="fc_title"></h1>
        <p class="sub" data-i18n="fc_sub"></p>
      </header>
      <div class="toolbar">
        <label><span data-i18n="region"></span><select id="fc-region"></select></label>
        <div class="field"><span data-i18n="hazard"></span><div class="seg" id="fc-hazard"></div></div>
        <div class="field" id="fc-measure-field"><span data-i18n="measure"></span><div class="seg" id="fc-measure"></div></div>
        <div class="field"><span data-i18n="horizon"></span><div class="seg" id="fc-horizon"></div></div>
        <div class="toolbar-end">
          <button id="fc-csv" class="btn btn-ghost" type="button" data-i18n="dl_csv"></button>
          <button id="fc-link" class="btn btn-ghost" type="button" data-i18n="copy_link"></button>
        </div>
      </div>
      <div class="fc-grid">
        <article class="card">
          <h2 id="fc-chart-title"></h2>
          <div id="fc-chart" class="chart"></div>
          <p class="note-small" id="fc-method"></p>
        </article>
        <aside class="stack" id="fc-numbers"></aside>
      </div>
      <article class="card">
        <div class="card-head"><h2 data-i18n="fc_todo"></h2><span class="priority" id="fc-priority"></span></div>
        <p class="timing" id="fc-timing"></p>
        <div class="todo-grid">
          <ol class="actions-list" id="fc-actions"></ol>
          <ul class="facts" id="fc-facts"></ul>
        </div>
      </article>
    </section>

    <!-- DISCOVERIES -->
    <section class="page" data-page="discover" hidden>
      <header class="page-head">
        <h1 data-i18n="dc_title"></h1>
        <p class="sub" id="dc-sub"></p>
      </header>
      <div class="seg seg-wide" id="dc-filter"></div>
      <div class="disc-grid" id="dc-grid"></div>
    </section>

    <!-- RELIABILITY: the proof that the analysis is right -->
    <section class="page" data-page="validation" hidden>
      <header class="page-head">
        <h1 data-i18n="va_title"></h1>
        <p class="sub" data-i18n="va_sub"></p>
      </header>
      <div id="va-body"></div>
    </section>

    <!-- AI ASSISTANT -->
    <section class="page" data-page="ai" hidden>
      <header class="page-head">
        <h1 data-i18n="ai_title"></h1>
        <p class="sub" data-i18n="ai_sub"></p>
      </header>
      <div class="ai-console">
        <aside class="ai-side">
          <section class="ai-block">
            <h2 data-i18n="ai_context"></h2>
            <label class="field"><span data-i18n="region"></span><select id="ai-region"></select></label>
            <div class="field"><span data-i18n="hazard"></span><div class="seg" id="ai-hazard"></div></div>
            <p class="ai-scope" id="ai-scope"></p>
            <dl class="ai-facts" id="ai-facts"></dl>
            <p class="note-small" data-i18n="ai_grounded"></p>
          </section>
          <section class="ai-block">
            <h2 data-i18n="ai_summary"></h2>
            <p class="note-small" data-i18n="ai_summary_help"></p>
            <button id="ai-summary" class="btn btn-ghost" type="button" data-i18n="ai_summary_btn"></button>
          </section>
        </aside>
        <section class="ai-main" aria-label="Conversation">
          <div class="ai-thread" id="ai-log" role="log" aria-live="polite" tabindex="0"></div>
          <form class="ai-form" id="ai-form">
            <textarea id="ai-input" rows="2" maxlength="500" required aria-label="Question"></textarea>
            <button id="ai-send" class="btn" type="submit" data-i18n="ai_send"></button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <footer class="footer"><p data-i18n="footer"></p></footer>
</body>
</html>
